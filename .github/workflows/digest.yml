name: digest
# Email retired 2026-09-30: the Board's 'New since your last visit' panel replaces it.
# Manual runs only (Actions -> digest -> Run workflow).
on:
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node digest/email.js --publish
      - name: Record what was announced
        run: |
          git config user.name "certamus-radar-bot"
          git config user.email "certamus-radar-bot@users.noreply.github.com"
          git add data/digest-state.json data/digest-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: digest $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q || { git rebase --abort; false; } && git push -q && exit 0; sleep 5; done
          exit 1
