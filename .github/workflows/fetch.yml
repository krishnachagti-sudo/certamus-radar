name: fetch
on:
  schedule: [{ cron: '30 0 * * *' }, { cron: '30 12 * * *' }]   # 06:00 and 18:00 IST
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Two sections, one job. Each run writes its own section to Supabase
      # (listings, archive and source_status, through sync_section) with the
      # service key, or on failure only its status (set_status), which the
      # board shows, so one section failing never blocks the other's data.
      - id: run
        env: { SUPABASE_SERVICE_KEY: '${{ secrets.SUPABASE_SERVICE_KEY }}' }
        run: |
          if node fetch/run.js; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - id: hack
        env: { SUPABASE_SERVICE_KEY: '${{ secrets.SUPABASE_SERVICE_KEY }}' }
        run: |
          if node fetch/hack-run.js; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      # Green while at least one section succeeded: a single section's failure
      # is already on the board through its status. Red only when both
      # failed, which points at the runner, the network or Supabase, not a source.
      - name: Fail the job if both sections failed
        if: steps.run.outputs.ok != '1' && steps.hack.outputs.ok != '1'
        run: exit 1
