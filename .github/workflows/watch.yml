name: watch
on:
  schedule: [{ cron: '30 23 * * 0' }]   # Monday 05:00 IST
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Reads the previous hashes from the Supabase watch table and upserts
      # the new ones (service key); nothing is committed to the repo.
      - run: node fetch/watch.js
        env: { SUPABASE_SERVICE_KEY: '${{ secrets.SUPABASE_SERVICE_KEY }}' }
