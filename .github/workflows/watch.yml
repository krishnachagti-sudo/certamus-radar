name: watch
on:
  schedule: [{ cron: '30 23 * * 0' }]   # Monday 05:00 IST
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fetch/watch.js
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "certamus-radar-bot"
          git config user.email "certamus-radar-bot@users.noreply.github.com"
          git add data/watch.json
          git diff --cached --quiet && exit 0
          git commit -m "data: watch $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q || { git rebase --abort; false; } && git push -q && exit 0; sleep 5; done
          exit 1
