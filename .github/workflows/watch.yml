name: watch
on:
  schedule: [{ cron: '30 23 * * 0' }]   # Monday 05:00 IST
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Reads the previous hashes from the watch table through the API and
      # upserts the new ones (service token); nothing is committed to the repo.
      - run: node fetch/watch.js
        env: { RADAR_API_URL: '${{ secrets.RADAR_API_URL }}', RADAR_SERVICE_TOKEN: '${{ secrets.RADAR_SERVICE_TOKEN }}' }
